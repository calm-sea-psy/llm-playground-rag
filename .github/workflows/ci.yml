# 린트 · 테스트. main push 와 PR 에서 돈다
#   PostgreSQL · Qdrant 를 서비스 컨테이너로 띄워 연동 테스트까지 돌린다 (docker-compose.yml 과 같은 이미지 · 계정)
#   리랭커 토크나이저 계약 테스트는 CI 환경변수가 있으면 skip 하지 않고 실패한다
# 첫 태그 전까지 모듈 레포를 같은 부모 폴더에 나란히 둔다 (pyproject.toml 의 path 의존)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-playground-rag
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v5
        with:
          path: llm-playground-rag
      - uses: actions/checkout@v5
        with:
          repository: calm-sea-psy/llm-playground-corpus
          path: llm-playground-corpus
      - uses: actions/checkout@v5
        with:
          repository: calm-sea-psy/llm-playground-llm
          path: llm-playground-llm
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Wait for Qdrant
        # 이미지에 curl 이 없어 서비스 헬스체크 대신 러너에서 확인한다
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          exit 1
      - name: Pytest
        run: uv run pytest -rs
