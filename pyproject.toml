[project]
name = "playground-rag"
version = "0.1.0"
description = "한국어 위키백과 덤프 기반 RAG 파이프라인과 QA 챗봇"
readme = "README.md"
authors = [
    { name = "yunpilsoo", email = "305675348+calm-sea-psy@users.noreply.github.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "lxml>=6.1.3",
    "mwparserfromhell>=0.7.2",
    "playground-corpus[parquet,local]",
    "playground-evalkit",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# Phase 1 동안 모듈 레포를 같은 부모 폴더에 나란히 clone 해서 editable 로 쓴다. 첫 태그 후 git + 태그로 바꾼다
playground-corpus = { path = "../llm-playground-corpus", editable = true }
playground-evalkit = { path = "../llm-playground-llm/packages/evalkit", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
