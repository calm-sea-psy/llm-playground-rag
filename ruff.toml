# 프로젝트 ruff 설정. 공유 설정(fastapi)을 extend 하고 numpy 규칙을 더한다.
# target-version 은 pyproject.toml 의 requires-python 에서 읽는다.

# .ruff/ 는 공유 설정 복사본이다. 직접 고치지 않고, 이 레포 고유 규칙은 이 파일에 둔다.
extend = ".ruff/fastapi.toml"

[lint]
extend-select = ["NPY"]

[lint.flake8-tidy-imports.banned-api]
# 이 표는 .ruff/fastapi.toml 의 같은 표와 합쳐지지 않고 통째로 덮어쓴다 — 공유 설정의 pydantic 금지를 다시 적는다.
# .ruff/ 를 새로 복사해 그쪽 목록이 바뀌면 여기도 맞춘다 (tests/test_ruff_bans.py 가 확인)
"pydantic".msg = "pydantic 은 경계 모듈(요청/응답 스키마, 설정 로더, LLM 출력 파서)에서만 쓴다. 내부는 @dataclass(frozen=True)."
"pydantic_settings".msg = "설정은 config.py 의 from_env() 안에서 검증하고 dataclass 로 바꿔 내보낸다."
# LLM 호출은 playground_llm 만 쓴다 (서버를 바꿔도 이 레포 코드가 그대로이게). 서버 클라이언트를 직접 import 하지 않는다
"ollama".msg = "LLM 은 playground_llm (OllamaLLM · LLM Protocol) 으로 부른다."
"openai".msg = "LLM 은 playground_llm (LLM Protocol 구현체) 으로 부른다."

[lint.isort]
known-first-party = ["playground_rag"]

[lint.extend-per-file-ignores]
# 디렉터리 패턴은 이 파일(프로젝트 루트) 기준.

# 테스트 · 스크립트
"tests/**/*.py"   = ["S101", "D", "ANN", "PLR2004", "S106", "S105", "TID251"]
"scripts/**/*.py" = ["T20", "D", "PLC0415"]

# 경계 모듈: pydantic(TID251) · Any(ANN401) 허용
"**/api/**/*.py"         = ["TID251", "ANN401"]   # 라우터 · 요청/응답 모델
"**/agent/state.py"      = ["TID251", "ANN401"]   # LangGraph 상태

# 수치 계산: 논문 표기 변수명(N803/N806) · 계산식 안 숫자 리터럴(PLR2004) 허용
"metrics.py"   = ["N803", "N806", "PLR2004"]
"ann_bench.py" = ["N803", "N806", "PLR2004"]
